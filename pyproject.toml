[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus"
version = "0.1.0"
description = "Does a sleep-like offline phase help a learning machine have insights?"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip() without strict= is fine for our equal-length pairs

[tool.pytest.ini_options]
testpaths = ["tests"]
